name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-2
  ECR_NGINX_REPOSITORY: holisticherbhealth/nginx
  ECR_PHP_REPOSITORY: holisticherbhealth/php
  ECS_SERVICE: holisticherbhealth-service-v1
  ECS_CLUSTER: holisticherbhealthcluster
  ECS_TASK_DEFINITION: ./aws/dev-task-definition.json
  CONTAINER_NAME_NGINX: holisticherbhealth-server
  CONTAINER_NAME_PHP: holisticherbhealth-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run PHP CodeSniffer
        working-directory: ./src
        run: composer codesniff
      - name: Run PHP Code Beautify
        working-directory: ./src
        run: composer codebeautify

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run tests
        id: run-tests
        working-directory: ./src
        run: composer run-tests
# Add Caching
  aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # We check if PHP || NGINX dockerfiles have been updated - or the src files have been updated - we create a new image if so
      - name: Check for changes in Dockerfile or source code
        id: check-changes
        run: |
          if git diff --quiet origin/develop HEAD -- ./dockerfiles/nginx.dockerfile ./dockerfiles/php.dockerfile ./src/; then
            echo "No changes detected in Dockerfile or source code."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in Dockerfile or source code."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # PHP Current Image Tag
      - name: Describe The Currently Running PHP Image
        if: steps.check-changes.outputs.skip_build == 'true'
        id: describe-current-php-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name $ECR_PHP_REPOSITORY \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1]')
          echo "Current PHP Image details: $IMAGE_DETAILS"
          echo "current_php_image=$(echo "$IMAGE_DETAILS" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Extract Current PHP Image
        if: steps.check-changes.outputs.skip_build == 'true'
        id: extract-current-php-image-tag
        run: |
          # Retrieve the JSON output from the previous step
          IMAGE_DETAILS='${{ steps.describe-current-php-image.outputs.current_php_image }}'
          # Extract image tags using jq
          IMAGE_TAGS=$(echo "$IMAGE_DETAILS" | jq -r '.imageTags[0]')
          echo "Extracted image tags: $IMAGE_TAGS"
          # Store the current PHP Image Tag in a GitHub Actions output variable
          echo "php_current_image_tag=$IMAGE_TAGS" >> $GITHUB_OUTPUT

      - name: Display Current PHP Image Tags
        if: steps.check-changes.outputs.skip_build == 'true'
        run: |
          echo "Current PHP Image Tags: ${{ steps.extract-current-php-image-tag.outputs.php_current_image_tag }}"

      # Nginx Current Image Tag

      - name: Describe The Currently Running NGINX Image
        if: steps.check-changes.outputs.skip_build == 'true'
        id: describe-current-nginx-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name $ECR_NGINX_REPOSITORY \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1]')
          echo "Current NGINX Image details: $IMAGE_DETAILS"
          echo "current_nginx_image=$(echo "$IMAGE_DETAILS" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Extract Current NGINX Image
        if: steps.check-changes.outputs.skip_build == 'true'
        id: extract-current-nginx-image-tag
        run: |
          # Retrieve the JSON output from the previous step
          IMAGE_DETAILS='${{ steps.describe-current-nginx-image.outputs.current_nginx_image }}'
          # Extract image tags using jq
          IMAGE_TAGS=$(echo "$IMAGE_DETAILS" | jq -r '.imageTags[0]')
          echo "Extracted image tags: $IMAGE_TAGS"
          # Store the current NGINX Image Tag in a GitHub Actions output variable
          echo "nginx_current_image_tag=$IMAGE_TAGS" >> $GITHUB_OUTPUT

      - name: Display Current NGINX Image Tags
        if: steps.check-changes.outputs.skip_build == 'true'
        run: |
          echo "Current NGINX Image Tags: ${{ steps.extract-current-nginx-image-tag.outputs.nginx_current_image_tag }}"

      # Build Image Tags

      - name: Build, tag, and push NGINX Image to Amazon ECR
        if: steps.check-changes.outputs.skip_build == 'false'
        id: build-nginx-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NGINX_IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG -f ./dockerfiles/nginx.dockerfile .
          docker push $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG
          echo "nginx_image=$ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push PHP Image to Amazon ECR
        if: steps.check-changes.outputs.skip_build == 'false'
        id: build-php-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PHP_IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG -f ./dockerfiles/php.dockerfile .
          docker push $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG
          echo "php_image=$ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG" >> $GITHUB_OUTPUT

      # Print Newly Built Images

      - name: Print NGINX image URI
        if: steps.check-changes.outputs.skip_build == 'false'
        run: echo ${{ steps.build-nginx-image.outputs.nginx_image }}

      - name: Print PHP image URI
        if: steps.check-changes.outputs.skip_build == 'false'
        run: echo ${{ steps.build-php-image.outputs.php_image }}

    # Render Task Definitions 

    # If 'skip_build' is false then render task defs with new image tags
      - name: Render ECS task definition for NGINX
        if: steps.check-changes.outputs.skip_build == 'false'
        id: render-nginx-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME_NGINX }}
          image: ${{ steps.build-nginx-image.outputs.nginx_image }}

      - name: Render ECS task definition for PHP
        if: steps.check-changes.outputs.skip_build == 'false'
        id: render-php-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-nginx-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_NAME_PHP }}
          image: ${{ steps.build-php-image.outputs.php_image }}


    # If 'skip_build' is true then render task defs without new image tags
      - name: Render ECS task definition for NGINX without new image tag 
        if: steps.check-changes.outputs.skip_build == 'true'
        id: render-nginx-task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NGINX_IMAGE_TAG: ${{ steps.extract-current-nginx-image-tag.outputs.nginx_current_image_tag }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME_NGINX }}
          image: $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG

      - name: Render ECS task definition for PHP
        if: steps.check-changes.outputs.skip_build == 'true'
        id: render-php-task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PHP_IMAGE_TAG: ${{ steps.extract-current-php-image-tag.outputs.php_current_image_tag }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-nginx-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_NAME_PHP }}
          image: $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG

      - name: Print updated task definition
          run: cat ${{ steps.render-php-task-def.outputs.task-definition }}


    # Deploy To ECS

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-php-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true
          desired-count: 1
      
     
    # ###### BELOW NEEDS TO BE REVIEWED ########

      # - name: Check if deployment was successful
