name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-2
  ECR_NGINX_REPOSITORY: holisticherbhealth/nginx
  ECR_PHP_REPOSITORY: holisticherbhealth/php
  ECS_SERVICE: holisticherbhealth-service-v1
  ECS_CLUSTER: holisticherbhealthcluster
  ECS_TASK_DEFINITION: ./aws/dev-task-definition.json
  CONTAINER_NAME_NGINX: holisticherbhealth-server
  CONTAINER_NAME_PHP: holisticherbhealth-api
  CONTAINER_NAME_MYSQL: holisticherbhealth-mysql
  MYSQL_IMAGE: mysql:8.0
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run PHP CodeSniffer
        working-directory: ./src
        run: composer codesniff
      - name: Run PHP Code Beautify
        working-directory: ./src
        run: composer codebeautify

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run tests
        id: run-tests
        working-directory: ./src
        run: composer run-tests

  aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check for changes in Dockerfile or source code
        id: check-changes
        run: |
          if git diff --quiet HEAD^ HEAD -- ./dockerfiles src/; then
            echo "No changes detected in Dockerfile or source code."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in Dockerfile or source code."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        # if: steps.check-changes.outputs.skip_build == 'false'
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push NGINX Image to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: build-nginx-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NGINX_IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG -f ./dockerfiles/nginx.dockerfile .
          docker push $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG
          echo "nginx_image=$ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$NGINX_IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push PHP Image to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: build-php-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PHP_IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG -f ./dockerfiles/php.dockerfile .
          docker push $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG
          echo "php_image=$ECR_REGISTRY/$ECR_PHP_REPOSITORY:$PHP_IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS task definition for NGINX
        id: render-nginx-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME_NGINX }}
          image: ${{ steps.build-nginx-image.outputs.nginx_image }}

      - name: Render ECS task definition for PHP
        id: render-php-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-nginx-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_NAME_PHP }}
          image: ${{ steps.build-php-image.outputs.php_image }}

      - name: Render ECS task definition for MYSQL
        id: render-mysql-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-php-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_NAME_MYSQL }}
          image: ${{ env.MYSQL_IMAGE}}

      - name: Print updated task definition
        run: cat ${{ steps.render-mysql-task-def.outputs.task-definition }}

      - name: Print NGINX image URI
        run: echo ${{ steps.build-nginx-image.outputs.nginx_image }}

      - name: Print PHP image URI
        run: echo ${{ steps.build-php-image.outputs.php_image }}

      # - name: Print Task Definition Path 
      #   run: echo ${{ steps.render-php-task-def.outputs.task-definition }} 

      # - name: Print Task Definition Path 
      #   run: cat ${{ steps.render-php-task-def.outputs.task-definition }} 

      # - name: Update ECS Service
      #   run: |
      #     aws ecs update-service \
      #       --cluster ${{ env.ECS_CLUSTER }} \
      #       --service ${{ env.ECS_SERVICE }} \
      #       --task-definition ${{ steps.render-php-task-def.outputs.task-definition }} \
      #       --force-new-deployment

      - name: Deploy Amazon ECS task definition
        # if: steps.check-changes.outputs.skip_build == 'false'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-mysql-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true

