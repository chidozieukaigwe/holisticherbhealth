name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-2
  ECR_NGINX_REPOSITORY: holisticherbhealth/nginx
  ECR_PHP_REPOSITORY: holisticherbhealth/php
  ECS_SERVICE: holisticherbhealth-service-v1
  ECS_CLUSTER: holisticherbhealthcluster
  ECS_TASK_DEFINITION: ./aws/dev-task-definition.json
  CONTAINER_NAME_NGINX: holisticherbhealth-server
  CONTAINER_NAME_PHP: holisticherbhealth-api
  ACTIONS_STEP_DEBUG: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run PHP CodeSniffer
        working-directory: ./src
        run: composer codesniff
      - name: Run PHP Code Beautify
        working-directory: ./src
        run: composer codebeautify

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version
          coverage: none
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: deps-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            deps-composer-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Run tests
        id: run-tests
        working-directory: ./src
        run: composer run-tests

  aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check for changes in Dockerfile or source code
        id: check-changes
        run: |
          if git diff --quiet HEAD^ HEAD -- ./dockerfiles src/; then
            echo "No changes detected in Dockerfile or source code."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in Dockerfile or source code."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        # if: steps.check-changes.outputs.skip_build == 'false'
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push NGINX Image to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: build-nginx-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG -f ./dockerfiles/nginx.dockerfile .
          docker push $ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push PHP Image to Amazon ECR
        # if: steps.check-changes.outputs.skip_build == 'false'
        id: build-php-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$IMAGE_TAG -f ./dockerfiles/php.dockerfile .
          docker push $ECR_REGISTRY/$ECR_PHP_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_PHP_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Test repeating this action again to inject container
      # - name: Fill in the new image ID in the Amazon ECS task definition
      #   # if: steps.check-changes.outputs.skip_build == 'false'
      #   id: task-def
      #   uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
      #   with:
      #     task-definition: ${{ env.ECS_TASK_DEFINITION }}
      #     container-name: ${{ env.CONTAINER_NAME_NGINX }}
      #     image: ${{ steps.build-nginx-image.outputs.image }}
      #     container-name-2: ${{ env.CONTAINER_NAME_PHP }}
      #     image-2: ${{ steps.build-php-image.outputs.image }}

      - name: Create a temporary directory
        id: temp-dir
        run: |
          TEMP_DIR=$(mktemp -d)
          echo "temp_dir=$TEMP_DIR" >> $GITHUB_OUTPUT

      - name: Update ECS task definition with new images
        id: update-task-def
        run: |
          # Install jq (JSON processor)
          sudo apt-get install -y jq

          # Copy the task definition to the temporary directory
          cp ${{ env.ECS_TASK_DEFINITION }} ${{ steps.temp-dir.outputs.temp_dir }}/task-definition.json

          # Update the task definition file with the new image URIs
          jq \
            --arg nginx_image "${{ steps.build-nginx-image.outputs.nginx_image }}" \
            --arg php_image "${{ steps.build-php-image.outputs.php_image }}" \
            '.containerDefinitions[] |= (if .name == "${{ env.CONTAINER_NAME_NGINX }}" then .image = $nginx_image else . end) |
             .containerDefinitions[] |= (if .name == "${{ env.CONTAINER_NAME_PHP }}" then .image = $php_image else . end)' \
             ${{ steps.temp-dir.outputs.temp_dir }}/task-definition.json > ${{ steps.temp-dir.outputs.temp_dir }}/temp.json && mv ${{ steps.temp-dir.outputs.temp_dir }}/temp.json ${{ steps.temp-dir.outputs.temp_dir }}/task-definition.json

          # Output the updated task definition as a single-line JSON string
          TASK_DEFINITION=$(jq -c . ${{ steps.temp-dir.outputs.temp_dir }}/task-definition.json)
          cat $TASK_DEFINITION
          echo "task_definition=$TASK_DEFINITION" >> $GITHUB_OUTPUT
        

      - name: Deploy Amazon ECS task definition
        # if: steps.check-changes.outputs.skip_build == 'false'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          # task-definition: ${{ steps.task-def.outputs.task-definition }}
          task-definition: ${{ steps.update-task-def.outputs.task_definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true