services:
  server:
    image: chidodesigns/holisticherbhealth-nginx
    # build:
    #   context: .
    #   dockerfile: dockerfiles/nginx.dockerfile
    ports:
      - "8000:80"
      - "8443:443"
    env_file:
      - ./env/nginx.env

    # volumes:
    #   - ./src:/var/www/html
    #   - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - mysql
  php:
    image: chidodesigns/holisticherbhealth-php
    # build:
    #   context: .
    #   dockerfile: dockerfiles/php.dockerfile
    # volumes:
    #   - ./src:/var/www/html:delegated
  composer:
    image: chidodesigns/holisticherbhealth-composer
    # build:
    #   context: .
    #   dockerfile: dockerfiles/composer.dockerfile
    # volumes:
    #   - ./src:/var/www/html
  artisan:
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
    volumes:
      - ./src:/var/www/html
    entrypoint: ["php", "/var/www/html/artisan"]
  npm:
    image: node:22-alpine
    working_dir: /var/www/html
    entrypoint: ["npm"]
    volumes:
      - ./src:/var/www/html
  mysql:
    image: mysql:8.0
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
  mysql_test:
    image: mysql:8.0
    volumes:
      - mysqltestdata:/var/lib/mysql
    ports:
      - "3308:3306"
    restart: unless-stopped
    env_file:
      - ./env/mysql-test.env
  # mailhog:
  #   image: mailhog/mailhog
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   restart: unless-stopped
volumes:
  mysqldata:
  mysqltestdata:
